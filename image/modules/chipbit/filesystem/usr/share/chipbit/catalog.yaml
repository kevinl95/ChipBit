# ChipBit catalog — the master list of available titles.
#
# This file is the single source of truth for BOTH:
#   * the image build  — CustomPiOS bakes in every title with `bundled: true`
#   * the runtime       — anything else installs on demand when a card is enrolled
# So "being less opinionated about what's baked in" is just flipping `bundled`.
#
# cards.yaml references entries here by `id`; a card is just a pointer
# (uid -> catalog id), and all launch detail lives here.
#
# Field contract:
#   settings.games_root
#                    absolute root for parent-supplied content exposed via
#                    the share / USB ingest workflow.
#   id        (req)  stable key, referenced by cards.yaml
#   label     (req)  display name in the enroll UI and loading screen
#   type      (req)  scummvm | dosbox | exec | web | ruffle
#   bundled   (req)  true = pre-installed in the image; false = install on enroll
#   install          declarative install spec: a map of manager -> packages.
#                    Only `apt`, `flatpak`, `pip` are honored. NEVER shell —
#                    so it's safe to honor even from imported card packs, and
#                    package-name drift (chromium vs chromium-browser) is a
#                    one-line fix here. Omit for engine titles and web (their
#                    engines/the browser are base dependencies in the image).
#   data             "required" when the parent must supply content (game data
#                    files / .swf). Enroll will not bind the card until it's
#                    present — same rule as a failed install.
#   data_dir         optional content directory override for scummvm titles;
#                    defaults to `scummvm/<id>` under `settings.games_root`.
#   Launch target (by type):
#     scummvm -> game_id + data_dir
#                `id` names the folder/UI key; `game_id` is ScummVM's internal
#                detector/launcher id. They are never interchangeable.
#     dosbox  -> conf            (path under settings.games_root)
#     exec    -> cmd             (argv list, never a shell string)
#     web     -> url + allowlist
#     ruffle  -> swf             (path under settings.games_root)
#   Optional curation metadata (shown when browsing to enroll):
#     subject, min_age, blurb, art
#
# NOTE: the engines themselves (scummvm, dosbox-staging, ruffle) and the kiosk
# browser are base dependencies installed by the CustomPiOS module, not titles
# here. The catalog lists only user-facing titles.

meta:
  catalog_version: 1

settings:
  games_root: /games

titles:

  # --- FOSS apps bundled in the image -------------------------------------
  - id: gcompris
    label: "GCompris"
    type: exec
    bundled: true
    install: { apt: [gcompris-qt, libqt5svg5] }
    cmd: ["gcompris-qt", "--fullscreen"]
    subject: general
    min_age: 2
    blurb: "100+ learning activities for ages 2–10."
    art: /art/gcompris.png

  - id: tuxpaint
    label: "Tux Paint"
    type: exec
    bundled: true
    install: { apt: [tuxpaint, tuxpaint-stamps-default] }
    cmd: ["tuxpaint", "--nosound", "--savedir=/var/lib/chipbit/tuxpaint"]
    # Must match --savedir above: that is where the drawings actually land, and
    # it is what "Your child's work" backs up.  ~/.tuxpaint is kept for config
    # written by TuxPaint versions that ignore --savedir; missing dirs are
    # skipped, so listing both is free.
    user_dirs: ["/var/lib/chipbit/tuxpaint", ".tuxpaint"]
    subject: art
    min_age: 3
    blurb: "Creative painting for young children."
    art: /art/tuxpaint.png

  # --- FOSS apps installed on first enroll --------------------------------
  - id: marble
    label: "Marble"
    type: exec
    bundled: false
    install: { apt: [marble] }
    cmd: ["marble"]
    subject: geography
    min_age: 6
    blurb: "Spin a 3D globe and explore the world."
    art: /art/marble.png

  - id: libreoffice-writer
    label: "LibreOffice Writer"
    type: exec
    bundled: false
    # gtk3 is the VCL plugin; without it LibreOffice falls back to the plain
    # X11 backend, which works but looks two decades old.  Named explicitly
    # because enrollment installs with --no-install-recommends.
    # This is by far the largest title in the catalog (a few hundred MB), so
    # the first enrollment takes a while on a slow link.
    install: { apt: [libreoffice-writer, libreoffice-gtk3] }
    cmd: ["soffice", "--writer", "--nologo"]
    # Documents/ is created by the launcher before the title starts, and the
    # image points XDG_DOCUMENTS_DIR at it, so "Save" lands somewhere
    # predictable and "Your child's work" can back it up.  Keep the two in
    # step: see filesystem/home/chipbit/.config/user-dirs.dirs.
    user_dirs: ["Documents"]
    subject: writing
    min_age: 8
    blurb: "Write and print stories, letters and homework."
    art: /art/libreoffice-writer.png

  - id: kstars
    label: "KStars"
    type: exec
    bundled: false
    install: { apt: [kstars] }
    cmd: ["kstars"]
    subject: astronomy
    min_age: 8
    blurb: "Interactive planetarium and night-sky explorer."
    art: /art/kstars.png

  - id: supertux
    label: "SuperTux"
    type: exec
    bundled: false
    install: { apt: [supertux] }
    cmd: ["supertux2"]
    subject: action
    min_age: 5
    blurb: "Classic side-scrolling platformer — free and open source."
    art: /art/supertux.png

  - id: supertuxkart
    label: "SuperTuxKart"
    type: exec
    bundled: false
    install: { apt: [supertuxkart] }
    cmd: ["supertuxkart", "--fullscreen"]
    subject: racing
    min_age: 4
    blurb: "Fun kart racing with open-source characters."
    art: /art/supertuxkart.png

  - id: scratch
    label: "Scratch"
    type: web
    bundled: true
    url: "https://scratch.mit.edu/projects/editor/"
    allowlist: ["scratch.mit.edu", "*.scratch.mit.edu", "cdn.scratch.mit.edu"]
    subject: coding
    min_age: 7
    blurb: "Drag-and-drop coding — build games, animations, and stories."
    art: /art/scratch.png

  # --- Web (browser is base; URL added via parent console) ----------------
  - id: pbskids
    label: "PBS Kids"
    type: web
    bundled: true
    url: "https://pbskids.org/games/"
    allowlist: ["pbskids.org", "*.pbskids.org"]
    subject: general
    min_age: 3
    blurb: "Free games and videos from PBS Kids."
    art: /art/pbskids.png

  # --- User-supplied content (parent adds data; enrolled via wizard) -------
  # ScummVM, DOSBox, Ruffle, and custom web/exec entries are added through
  # the parent console wizard and stored in /var/lib/chipbit/user-catalog.yaml.
