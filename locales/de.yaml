# ChipBit — Deutsch
#
# HOW TO TRANSLATE
#   Copy this file to <code>.yaml (e.g. fr.yaml) and translate the values on
#   the right of each colon.  Leave the keys on the left exactly as they are.
#
#   You do NOT have to finish.  Any key you leave out falls back to English,
#   so a file with ten lines in it is a useful contribution and will not leave
#   a hole in a screen.
#
#   To see your work: put the file in /var/lib/chipbit/locales/ on a running
#   ChipBit and restart the service, or on any computer run
#       chipbit-web --locale de --locales-dir ./locales
#   and open http://127.0.0.1:8080/ — it will print how many strings you have
#   translated and how many are still falling back to English.
#
# RULES
#   * {uid}, {label}, {title} are filled in at runtime.  Keep them spelled
#     exactly like that; you may move them within the sentence.
#   * Some values contain HTML like <code>/games/</code>.  Keep the tags and
#     translate the words around them.
#   * /games/ is a real folder on the device.  Never translate a path.
#   * "ChipBit" is a product name and is never translated.

# ---------------------------------------------------------------------------
# START HERE.  These twelve strings are everything a child ever sees.
# Translate only this block and a child who reads no English gets a machine
# that speaks to them, even while the parent console is still in English.
# ---------------------------------------------------------------------------
