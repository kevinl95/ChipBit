# ChipBit — Español
#
# DRAFT. Written by ChipBit's maintainers, not by a native speaker. The
# grammar should be sound, but register — especially the wording aimed at
# young children — needs a native reader. Corrections very welcome; this file
# exists to be easier to fix than to write from scratch.
#
# This is neutral/European Spanish. If you want a Latin American variant,
# copy this to es_MX.yaml (or similar) rather than editing this file.
#
# HOW TO TRANSLATE
#   Copy this file to <code>.yaml and translate the values to the right of
#   each colon. Leave the keys on the left exactly as they are. You do NOT
#   have to finish — anything you leave out falls back to English.
#
#   To preview your work, on any computer:
#       chipbit-web --locale es --locales-dir ./locales
#   or drop the file into /var/lib/chipbit/locales/ on a running ChipBit and
#   restart the service. Startup prints how many strings you have translated.
#
# RULES
#   * {uid}, {label}, {title} are filled in at runtime. Keep them spelled
#     exactly like that; you may move them within the sentence.
#   * Some values contain HTML like <code>/games/</code>. Keep the tags.
#   * /games/ is a real folder on the device. Never translate a path.
#   * "ChipBit" is a product name and is never translated.

# ---------------------------------------------------------------------------
# START HERE. These twelve strings are everything a child ever sees.
# ---------------------------------------------------------------------------
