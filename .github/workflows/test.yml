name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install launcher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './launcher[dev]'

      - name: Ruff
        run: python -m ruff check launcher/src launcher/tests

      - name: Pytest
        run: python -m pytest launcher/tests