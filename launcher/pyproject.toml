[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chipbit"
version = "0.1.0"
description = "ChipBit launcher and web service"
requires-python = ">=3.11"
dependencies = [
  "evdev>=1.7.1",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
chipbit-launcher = "chipbit.cli:launcher_main"
chipbit-web = "chipbit.cli:web_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]